<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="Phosphor Decay — 零依赖 CRT 故障美学交互效果：打字机入场、分阶段数据崩坏、错误代码风暴与转场钩子。">
<title>Phosphor Decay · CRT Glitch Effect</title>
<style>
  /* =========================================================================
     Phosphor Decay · 基础层
     说明：cursor:none 与虚拟光标只在「有精细指针」的设备上启用（见文末媒体查询），
     触屏设备保留原生交互，避免出现一个停在屏幕中央不动的假光标。
     ========================================================================= */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0c0c0c;
    background-image:
      radial-gradient(circle at 25% 20%, rgba(70, 70, 70, 0.45) 0%, transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(90, 90, 90, 0.35) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(130, 130, 130, 0.15) 0%, transparent 60%),
      repeating-linear-gradient(45deg,
        rgba(40, 40, 40, 0.3) 0px,
        rgba(40, 40, 40, 0.3) 2px,
        transparent 2px,
        transparent 6px);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    position: relative;
  }

  /* ===== 扫描线层 ===== */
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background:
      repeating-linear-gradient(0deg,
        rgba(0, 0, 0, 0.85) 0px,
        rgba(0, 0, 0, 0.85) 2px,
        transparent 2px,
        transparent 5px),
      repeating-linear-gradient(90deg,
        rgba(220, 220, 220, 0.08) 0px,
        rgba(220, 220, 220, 0.08) 1px,
        transparent 1px,
        transparent 6px);
    mix-blend-mode: multiply;
    animation: scanPulse 0.25s linear infinite, scanMove 0.5s linear infinite;
    opacity: 0.95;
  }
  @keyframes scanMove {
    0% { background-position-y: 0; }
    100% { background-position-y: 8px; }
  }
  @keyframes scanPulse {
    0% { opacity: 0.75; filter: brightness(0.9); }
    50% { opacity: 1; filter: brightness(1.2); }
    100% { opacity: 0.75; filter: brightness(0.9); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    background-image:
      repeating-linear-gradient(45deg,
        rgba(120, 120, 120, 0.12) 0px,
        rgba(120, 120, 120, 0.12) 1px,
        transparent 1px,
        transparent 8px),
      repeating-linear-gradient(-45deg,
        rgba(180, 180, 180, 0.08) 0px,
        rgba(180, 180, 180, 0.08) 1px,
        transparent 1px,
        transparent 10px);
    opacity: 0.65;
    mix-blend-mode: overlay;
  }

  .scan-beam {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 97;
    background: linear-gradient(0deg,
      transparent 0%,
      rgba(255, 255, 255, 0.03) 45%,
      rgba(255, 255, 255, 0.12) 50%,
      rgba(255, 255, 255, 0.03) 55%,
      transparent 100%);
    background-size: 100% 200%;
    animation: beamSweep 1.2s linear infinite;
    mix-blend-mode: screen;
    opacity: 0.7;
  }
  @keyframes beamSweep {
    0% { background-position: 0 200%; }
    100% { background-position: 0 -200%; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 96;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(0, 0, 0, 0.6) 100%);
    mix-blend-mode: multiply;
  }

  .crt-flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 98;
    background: radial-gradient(circle at 50% 50%, rgba(180, 180, 180, 0.08) 0%, transparent 75%);
    animation: flicker 0.1s infinite alternate;
    mix-blend-mode: screen;
  }
  @keyframes flicker {
    0% { opacity: 0.3; }
    50% { opacity: 0.6; }
    100% { opacity: 0.3; }
  }

  /* ===== 主容器 ===== */
  .terminal {
    position: relative;
    z-index: 10;
    width: 800px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ===== 打字机 / 故障文本 ===== */
  .text-stage {
    position: relative;
    width: 100%;
    min-height: 3.5rem;
    margin-bottom: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .text-layer {
    position: relative;
    font-size: 2.2rem;
    font-weight: bold;
    letter-spacing: 4px;
    color: #fff;
    text-shadow:
      0 0 8px rgba(255, 255, 255, 0.9),
      0 0 16px rgba(200, 200, 200, 0.6),
      0 0 32px rgba(150, 150, 150, 0.3);
    white-space: nowrap;
    min-height: 3.5rem;
    line-height: 1.4;
    text-align: center;
    user-select: none;
    pointer-events: none;
  }
  .text-layer.typing {
    border-right: 4px solid #fff;
    animation: blinkCursor 0.8s step-end infinite;
  }
  @keyframes blinkCursor {
    0%, 100% { border-color: #fff; }
    50% { border-color: transparent; }
  }

  /* 崩坏定格后的报错态：直接复用 .text-layer 的排版，只换配色 */
  .text-layer.error {
    color: #ff2a2a;
    text-shadow:
      0 0 10px rgba(255, 0, 0, 0.9),
      0 0 20px rgba(255, 0, 0, 0.6),
      0 0 40px rgba(255, 0, 0, 0.4),
      0 0 80px rgba(255, 0, 0, 0.2);
    animation: errorPulse 0.8s infinite alternate;
  }
  @keyframes errorPulse {
    0% { opacity: 0.8; }
    100% { opacity: 1; }
  }

  /* ===== 乱码中闪现的可读词 ===== */
  .hidden-word {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 40;
    font-size: 2.4rem;
    font-weight: bold;
    letter-spacing: 4px;
    color: #ffffff;
    text-shadow:
      0 0 8px #ffffff,
      0 0 20px #00ffff,
      0 0 45px #00ffff;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    animation: hiddenWordFlicker 0.08s steps(1) infinite;
  }
  @keyframes hiddenWordFlicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* ===== 按钮 ===== */
  .glow-btn {
    align-self: center;
    display: block;
    background: rgba(30, 30, 30, 0.4);
    border: 2px solid #fff;
    color: #fff;
    font-family: inherit;
    font-size: 1.5rem;
    font-weight: bold;
    padding: 1rem 3rem;
    letter-spacing: 8px;
    outline: none;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 0 10px #fff, 0 0 25px rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(1px);
  }
  .glow-btn.show {
    opacity: 1;
    pointer-events: auto;
    animation: btnPulse 1.5s infinite alternate;
  }
  .glow-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.5);
  }
  .glow-btn:focus-visible {
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 0 3px #00e5ff, 0 0 30px rgba(0, 229, 255, 0.6);
  }
  @keyframes btnPulse {
    0% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(255, 255, 255, 0.2); }
    100% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.9), 0 0 60px rgba(255, 255, 255, 0.5); }
  }

  /* ===== 虚拟光标 & 粒子拖影（默认隐藏，仅精细指针设备启用） ===== */
  .cursor-ghost {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 9999;
    width: 28px;
    height: 36px;
    transform: translate(0, 0);
    filter:
      drop-shadow(0 0 12px rgba(255, 255, 255, 1))
      drop-shadow(0 0 24px rgba(255, 255, 255, 0.9))
      drop-shadow(0 0 48px rgba(255, 255, 255, 0.7))
      drop-shadow(0 0 80px rgba(255, 255, 255, 0.4));
    will-change: transform;
    transition: transform 0.05s ease-out, filter 0.2s;
    display: none;
  }
  .cursor-ghost svg {
    width: 100%;
    height: 100%;
    display: block;
    shape-rendering: geometricPrecision;
  }

  .trail-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    overflow: hidden;
  }
  .trail-particle {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
      0 0 4px #ffffff,
      0 0 10px rgba(255, 255, 255, 1),
      0 0 20px rgba(255, 255, 255, 0.8),
      0 0 40px rgba(255, 255, 255, 0.4);
    pointer-events: none;
    will-change: transform, opacity, width, height;
    animation: particleFade 0.8s ease-out forwards;
  }
  @keyframes particleFade {
    0% { opacity: 1; transform: scale(1); }
    60% { opacity: 0.8; }
    100% { opacity: 0; transform: scale(0.4); }
  }

  /* ===== 黑屏覆盖层 ===== */
  .blackout {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s linear;
  }
  .blackout.active { opacity: 1; }

  /* ===== 高亮色带扫描 ===== */
  .color-band {
    position: absolute;
    left: 0;
    right: 0;
    height: 40%;
    top: 30%;
    pointer-events: none;
    z-index: 20;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 0, 60, 0.15) 20%,
      rgba(0, 255, 255, 0.25) 50%,
      rgba(255, 0, 60, 0.15) 80%,
      transparent 100%);
    mix-blend-mode: screen;
    opacity: 0;
    filter: blur(1px);
    transform: translateX(-100%);
  }
  .color-band.active { animation: bandSweep 0.55s ease-out forwards; }
  @keyframes bandSweep {
    0% { transform: translateX(-100%); opacity: 1; }
    100% { transform: translateX(100%); opacity: 0.9; }
  }

  @keyframes quickShake {
    0% { transform: translate(0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, -1px); }
    100% { transform: translate(0); }
  }

  /* ===== 血色覆盖 ===== */
  .blood-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 0, 0, 0.15) 0%,
      rgba(120, 0, 0, 0.55) 60%,
      rgba(40, 0, 0, 0.85) 100%);
    opacity: 0;
    mix-blend-mode: multiply;
    transition: opacity 0.15s linear;
  }

  /* ===== 全屏撕裂条 ===== */
  .glitch-tear {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 600;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.9);
    mix-blend-mode: difference;
    opacity: 0;
  }
  .glitch-tear.active { animation: tearFlash 0.18s steps(2) 1; }
  @keyframes tearFlash {
    0% { opacity: 0.9; transform: scaleY(1); }
    50% { opacity: 0.5; transform: scaleY(2.5); }
    100% { opacity: 0; transform: scaleY(0.3); }
  }

  /* ===== 全屏红色闪动 ===== */
  .red-alert {
    position: fixed;
    inset: 0;
    z-index: 700;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg,
        rgba(255, 0, 0, 0.85) 0px,
        rgba(255, 0, 0, 0.85) 4px,
        rgba(0, 0, 0, 0.9) 4px,
        rgba(0, 0, 0, 0.9) 8px);
    opacity: 0;
    mix-blend-mode: screen;
  }
  .red-alert.on { animation: redStrobe 0.12s steps(1) infinite; }
  @keyframes redStrobe {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  /* ===== 错误代码风暴 ===== */
  .code-burst {
    position: fixed;
    inset: 0;
    z-index: 520;
    pointer-events: none;
    overflow: hidden;
  }
  .code-burst-item {
    position: absolute;
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    white-space: nowrap;
    color: #ff4d4d;
    text-shadow: 0 0 6px #f00, 0 0 14px #900;
    animation: codeStrobe 0.09s steps(1) infinite;
    will-change: opacity;
  }
  .code-burst-item.green { color: #7fff7f; text-shadow: 0 0 6px #0f0, 0 0 14px #060; }
  .code-burst-item.cyan  { color: #7fffff; text-shadow: 0 0 6px #0ff, 0 0 14px #066; }

  .code-burst-item.whisper {
    color: #ffe27a;
    text-shadow: 0 0 8px #ffd76a, 0 0 20px #ffae00, 0 0 40px #ff8800;
    animation: whisperPulse 0.55s ease-in-out infinite alternate;
    background: rgba(0, 0, 0, 0.7);
    padding: 0.4rem 0.9rem;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(255, 210, 90, 0.25);
  }
  .code-burst-item.whisper.pink {
    color: #ff9df5;
    text-shadow: 0 0 8px #ff9df5, 0 0 20px #ff00c8, 0 0 40px #b0008a;
    box-shadow: 0 0 20px rgba(255, 120, 230, 0.25);
  }

  @keyframes codeStrobe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  @keyframes whisperPulse {
    0% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  /* ===== 最终闪白（转场口） ===== */
  .flash-white {
    position: fixed;
    inset: 0;
    z-index: 800;
    pointer-events: none;
    background: #fff;
    opacity: 0;
  }
  .flash-white.on { animation: whiteHit 0.5s ease-out forwards; }
  @keyframes whiteHit {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== 屏幕整体抖动 ===== */
  body.shake-hard { animation: hardShake 0.06s steps(2) infinite; }
  @keyframes hardShake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-4px, 2px); }
    50% { transform: translate(4px, -2px); }
    75% { transform: translate(-2px, -3px); }
    100% { transform: translate(2px, 3px); }
  }

  /* ===== 减弱动效模式下的提示条 ===== */
  .rm-note {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%);
    z-index: 10001;
    font-size: 0.72rem;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(0, 0, 0, 0.6);
    padding: 0.3rem 0.7rem;
    display: none;
  }
  .rm-note.show { display: block; }

  /* ===== 精细指针设备：启用虚拟光标、隐藏原生光标 ===== */
  @media (hover: hover) and (pointer: fine) {
    body.has-cursor,
    body.has-cursor .glow-btn { cursor: none; }
    body.has-cursor .cursor-ghost { display: block; }
  }

  /* ===== 小屏适配 ===== */
  @media (max-width: 600px) {
    .text-layer {
      font-size: 1.4rem;
      letter-spacing: 2px;
      white-space: normal;
      text-align: center;
    }
    .text-layer.typing { border-right: none; }
    .glow-btn { font-size: 1.2rem; padding: 0.8rem 2rem; letter-spacing: 4px; }
    .cursor-ghost {
      width: 22px;
      height: 28px;
      filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 16px #fff)
        drop-shadow(0 0 32px rgba(255, 255, 255, 0.8));
    }
    .scanlines { animation-duration: 0.4s, 0.3s; }
    .hidden-word { font-size: 1.5rem; letter-spacing: 2px; }
    .code-burst-item.whisper { font-size: 1rem !important; padding: 0.3rem 0.6rem; }
  }

  /* ===== 无障碍：尊重系统的「减弱动态效果」偏好 =====
     满屏频闪 + 0.06s 抖动 + 高频 strobe 对光敏人群有真实风险。
     这里把 CSS 动画全部压到接近静止，JS 侧同步走静态降级序列（见 CONFIG.reducedMotion）。 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .scanlines, .crt-flicker, .scan-beam,
    .text-layer, .text-layer.error, .text-layer.typing,
    .hidden-word, .glitch-tear, .red-alert,
    .code-burst-item, .code-burst-item.whisper,
    .flash-white, .trail-particle { animation: none !important; }
    body.shake-hard { animation: none !important; }
    .crt-flicker, .scan-beam { opacity: 0.25; }
  }
</style>
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="scan-beam" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="crt-flicker" aria-hidden="true"></div>

  <div class="trail-container" id="trailContainer" aria-hidden="true"></div>

  <div class="cursor-ghost" id="virtualCursor" aria-hidden="true">
    <svg viewBox="0 0 28 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0 L22 17 L13 19 L8 32 L0 0 Z"
            fill="white" stroke="#ffffff" stroke-width="1.5"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="blackout" id="blackout" aria-hidden="true"></div>

  <div class="blood-overlay" id="bloodOverlay" aria-hidden="true"></div>
  <div class="red-alert" id="redAlert" aria-hidden="true"></div>
  <div class="flash-white" id="flashWhite" aria-hidden="true"></div>
  <div class="code-burst" id="codeBurst" aria-hidden="true"></div>

  <main class="terminal">
    <div class="text-stage" id="textStage">
      <div class="text-layer typing" id="textLayer" role="status" aria-live="polite"></div>
    </div>
    <button class="glow-btn" id="btn" type="button">DECRYPT</button>
  </main>

  <div class="rm-note" id="rmNote" role="status">REDUCED-MOTION MODE · 已按系统偏好关闭频闪与抖动</div>

<script>
/* =============================================================================
   Phosphor Decay · CRT 数据崩坏效果
   零依赖 · 单文件 · 可配置
   用法：
     1) 直接双击 index.html 打开即可看到效果（自动 init）；
     2) 或把本段 JS 抽成 phosphor-decay.js 单独引入，
        在引入前设 window.__PHOSPHOR_NO_AUTOINIT = true，
        再自行调用 PhosphorDecay.init({ text: '...', onDone: () => go() });
   ========================================================================== */
(function (global) {
  'use strict';

  /* ===== 默认配置：所有可变内容都集中在这里，改参数即可，无需读源码 ===== */
  var DEFAULT_CONFIG = {
    /* 入场打字机文本 */
    text: 'loading the world.....',
    /* 打字机速度（ms/字符） */
    typingSpeed: 100,
    /* 崩坏定格后的报错文本 */
    errorText: 'ERROR: DATA CORRUPTED',
    /* 按钮文案 */
    buttonLabel: 'DECRYPT',
    /* 结束后是否显示重播按钮 */
    replay: true,
    replayLabel: 'REPLAY',

    /* 乱码字符池 */
    corruptChars: '!@#$%^&*()_+-=[]{}|;:<>?/\\~`0123456789ABCDEFabcdef\u2591\u2592\u2593\u2588\u2584\u2580\u25A0\u25A1\u25AA\u25AB\u25C6\u25C7\u25CB\u25CF',
    /* 崩坏高峰闪现的可读词 */
    hiddenWords: ['HELLO', 'I SEE YOU', "DON'T", 'WHO ARE YOU', "IT'S TOO LATE", 'BEHIND YOU', 'WAKE UP'],
    /* 错误代码风暴语料 */
    codeSnippets: [
      'ERR 0x7F3A: SEGFAULT', 'SIGSEGV at 0xDEADBEEF', 'stack overflow',
      'NULL POINTER DEREF', 'FATAL: KERNEL PANIC', '0x000000C4',
      'memory leak detected', 'heap corruption', 'segmentation fault (core dumped)',
      'TRACE/BPF', 'read error on /dev/null', 'invalid opcode 0x0F0B',
      'page fault at 0xFFFF0000', 'double fault', 'GPF 0x0D', 'SYSTEM HALTED',
      'IRQ 0x0B', 'DMA OVERRUN', 'BAD RAM SECTOR', '0xDEADBEEF',
      'undefined instruction', 'BUS ERROR', 'FPU FAULT', 'TLB MISS'
    ],
    /* 慢速「低语」语料（非错误信息，更醒目） */
    whisperSnippets: [
      'who are you', "it's too late", 'I see you', 'behind you',
      'wake up', 'let me out', 'we are already inside', 'stop looking'
    ],

    /* 文本切片数（错位分层） */
    slices: 8,
    /* 错误代码风暴：同屏节点上限，防止峰值两百多个节点同时跑动画 */
    maxBurstNodes: 90,
    burst: {
      duration: 2600,   // 风暴持续（ms）
      interval: 70,     // 补种间隔（ms）
      whisperChance: 0.22,
      patchMin: 3,      // 单簇最少节点
      patchMax: 8,      // 单簇最多节点（含）
      initialPatches: 12 // 开局铺底簇数（* 平均簇大小 受 maxBurstNodes 截断）
    },

    /* 虚拟光标与粒子拖影 */
    enableCursor: true,
    enableParticles: true,

    /* 'auto' = 跟随系统 prefers-reduced-motion；true/false 可强制开关 */
    reducedMotion: 'auto',
    /* 减弱动效模式下是否显示底部提示条 */
    showReducedMotionNote: true,

    /* 转场钩子：崩坏序列结束时触发（已自动 dispatch CustomEvent('corruption:done')） */
    onDone: null
  };

  var VERSION = '1.0.0';

  /* ===== 内部状态 ===== */
  var cfg = null;
  var els = {};
  var timers = new Set();
  var rafs = new Set();
  var typers = new Set();
  var typerRaf = null;
  var nodePool = [];
  var cursorRaf = null;
  var onMediaChange = null;
  var state = { phase: 'boot', cursorEnabled: false, running: false };
  var mouse = { x: 0, y: 0, lastTrail: 0 };
  var mediaReduce = null;
  var mediaFine = null;

  /* ===== 工具：可统一清理的定时器 ===== */
  function later(fn, ms) {
    var id = setTimeout(function () { timers.delete(id); fn(); }, ms);
    timers.add(id);
    return id;
  }
  function every(fn, ms) {
    var id = setInterval(fn, ms);
    timers.add(id);
    return id;
  }
  function stop(id) { if (id) { clearInterval(id); clearTimeout(id); timers.delete(id); } }
  function clearAll() {
    timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
    timers.clear();
    rafs.forEach(function (id) { cancelAnimationFrame(id); });
    rafs.clear();
    typers.clear();
    if (typerRaf) { cancelAnimationFrame(typerRaf); typerRaf = null; }
    if (cursorRaf) { cancelAnimationFrame(cursorRaf); cursorRaf = null; }
  }
  function rnd(min, max) { return min + Math.random() * (max - min); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* matchMedia 兜底：极老环境或非浏览器宿主下不因缺 API 而整体崩掉 */
  function matchMediaSafe(query) {
    try {
      if (typeof global.matchMedia === 'function') return global.matchMedia(query);
    } catch (e) { /* ignore */ }
    return { matches: false, media: query, addEventListener: null, removeEventListener: null };
  }

  function isReduced() {
    if (cfg.reducedMotion === true) return true;
    if (cfg.reducedMotion === false) return false;
    return !!(mediaReduce && mediaReduce.matches);
  }
  function hasFinePointer() { return !!(mediaFine && mediaFine.matches); }

  /* ===== 1. 入场打字机 ===== */
  function startTyping() {
    state.phase = 'typing';
    var i = 0;
    els.textLayer.style.cssText = '';
    els.textLayer.textContent = '';
    els.textLayer.classList.add('typing');
    els.textLayer.classList.remove('error');
    els.textLayer.style.visibility = '';
    els.textLayer.style.transform = '';
    els.btn.classList.remove('show');
    els.btn.style.pointerEvents = '';
    els.btn.textContent = cfg.buttonLabel;

    var t = every(function () {
      if (i < cfg.text.length) {
        els.textLayer.textContent += cfg.text.charAt(i);
        i++;
      } else {
        stop(t);
        els.textLayer.classList.remove('typing');
        state.phase = 'ready';
        later(function () { els.btn.classList.add('show'); }, 300);
      }
    }, cfg.typingSpeed);
  }

  /* ===== 2. 字符替换 ===== */
  function corruptText(original, intensity) {
    var out = '';
    for (var k = 0; k < original.length; k++) {
      var ch = original[k];
      if (ch === ' ') { out += ' '; continue; }
      out += (Math.random() < intensity) ? pick(cfg.corruptChars) : ch;
    }
    return out;
  }

  /* ===== 2.5 乱码中闪现可读词 ===== */
  function flashReadableWord() {
    var el = document.createElement('div');
    el.className = 'hidden-word';
    el.textContent = pick(cfg.hiddenWords);
    els.textStage.appendChild(el);
    later(function () { el.remove(); }, 120);
  }

  /* ===== 3. 色带扫描 ===== */
  function triggerColorBand() {
    var band = document.createElement('div');
    band.className = 'color-band';
    els.textStage.appendChild(band);
    void band.offsetWidth;
    band.classList.add('active');
    later(function () { band.remove(); }, 650);
  }

  /* ===== 4. 全屏撕裂条 ===== */
  function spawnTear() {
    var tear = document.createElement('div');
    tear.className = 'glitch-tear';
    tear.style.top = (Math.random() * 100) + 'vh';
    tear.style.height = (2 + Math.random() * 30) + 'px';
    document.body.appendChild(tear);
    requestAnimationFrame(function () { tear.classList.add('active'); });
    later(function () { tear.remove(); }, 300);
  }

  /* ===== 4.5 错误代码风暴：节点池 + 单 rAF 打字循环 =====
     原版每个节点各跑一个 setInterval，峰值两百多个定时器；
     这里改为全部由一个 requestAnimationFrame 循环驱动，并对同屏节点数设上限。 */
  function acquireNode() {
    if (els.codeBurst.childElementCount >= cfg.maxBurstNodes) return null;
    var el = nodePool.pop();
    if (!el) el = document.createElement('div');
    el.className = 'code-burst-item';
    el.style.cssText = '';
    el.textContent = '';
    els.codeBurst.appendChild(el);
    return el;
  }
  function releaseNode(el) {
    el.remove();
    if (nodePool.length < cfg.maxBurstNodes) nodePool.push(el);
  }

  function typerLoop(now) {
    typerRaf = null;
    typers.forEach(function (t) {
      var guard = 0;
      while (now - t.last >= t.speed && t.idx < t.text.length && guard++ < 12) {
        t.idx++;
        t.last += t.speed;
        t.el.textContent = t.text.slice(0, t.idx);
      }
      if (t.idx >= t.text.length) typers.delete(t);
    });
    if (typers.size) typerRaf = requestAnimationFrame(typerLoop);
  }
  function typeCodeLine(el, text, speed) {
    var t = { el: el, text: text, speed: speed, idx: 0, last: performance.now() };
    typers.add(t);
    if (!typerRaf) typerRaf = requestAnimationFrame(typerLoop);
    return t;
  }

  function spawnCodePatch() {
    var baseX = Math.random() * 100;
    var baseY = Math.random() * 100;
    var count = cfg.burst.patchMin +
      Math.floor(Math.random() * (cfg.burst.patchMax - cfg.burst.patchMin + 1));

    for (var n = 0; n < count; n++) {
      var el = acquireNode();
      if (!el) return; // 同屏已达上限，本簇不再补种

      var roll = Math.random();
      if (roll < 0.35) el.classList.add('green');
      else if (roll < 0.55) el.classList.add('cyan');

      el.style.left = clamp(baseX + rnd(-14, 14), 0, 100) + 'vw';
      el.style.top = clamp(baseY + rnd(-10, 10), 0, 100) + 'vh';
      el.style.fontSize = rnd(0.7, 2.0) + 'rem';

      var typer = typeCodeLine(el, pick(cfg.codeSnippets), rnd(10, 28));
      later((function (node, ty) {
        return function () { typers.delete(ty); releaseNode(node); };
      })(el, typer), 1200 + Math.random() * 700);
    }
  }

  /* 慢速「低语」：更靠中间、字号更大、逐字可见 */
  function spawnWhisperPatch() {
    var el = acquireNode();
    if (!el) return;
    el.classList.add('whisper');
    if (Math.random() < 0.5) el.classList.add('pink');

    el.style.left = rnd(22, 78) + 'vw';
    el.style.top = rnd(25, 75) + 'vh';
    el.style.fontSize = rnd(1.3, 2.2) + 'rem';

    var msg = pick(cfg.whisperSnippets);
    var speed = rnd(55, 115);
    var typer = typeCodeLine(el, msg, speed);
    later((function (node, ty) {
      return function () { typers.delete(ty); releaseNode(node); };
    })(el, typer), msg.length * speed + 2200 + Math.random() * 1000);
  }

  function runErrorCodeBurst(duration) {
    duration = duration || cfg.burst.duration;
    clearCodeBurst();

    for (var n = 0; n < cfg.burst.initialPatches; n++) {
      if (Math.random() < cfg.burst.whisperChance) spawnWhisperPatch();
      else spawnCodePatch();
    }

    var start = Date.now();
    var timer = every(function () {
      if (Date.now() - start > duration) { stop(timer); clearCodeBurst(); return; }
      if (Math.random() < cfg.burst.whisperChance) spawnWhisperPatch();
      else spawnCodePatch();
    }, cfg.burst.interval);
  }

  function clearCodeBurst() {
    Array.prototype.slice.call(els.codeBurst.children).forEach(function (el) {
      typers.forEach(function (t) { if (t.el === el) typers.delete(t); });
      releaseNode(el);
    });
  }

  /* ===== 5. 完整崩坏序列 ===== */
  function runDataCorruption() {
    if (state.phase === 'corrupting') return;
    state.phase = 'corrupting';
    els.btn.classList.remove('show');
    els.btn.style.pointerEvents = 'none';

    if (isReduced()) { runReducedSequence(); return; }

    var originalText = els.textLayer.textContent;
    els.textLayer.style.visibility = 'hidden';

    /* 切片：从实际渲染样式继承字号/字距，改配置后无需同步改样式 */
    var cs = getComputedStyle(els.textLayer);
    var layerRect = els.textLayer.getBoundingClientRect();
    var stageRect = els.textStage.getBoundingClientRect();
    var baseTop = layerRect.top - stageRect.top;
    var baseLeft = layerRect.left - stageRect.left;
    var baseW = layerRect.width;
    var baseH = layerRect.height;

    var NUM_SLICES = cfg.slices;
    var sliceH = baseH / NUM_SLICES;
    var lineSlices = [];

    for (var s = 0; s < NUM_SLICES; s++) {
      var slice = document.createElement('div');
      slice.style.cssText =
        'position:absolute;' +
        'left:' + baseLeft + 'px;top:' + baseTop + 'px;' +
        'width:' + baseW + 'px;height:' + baseH + 'px;' +
        'font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';' +
        'letter-spacing:' + cs.letterSpacing + ';color:' + cs.color + ';' +
        'text-shadow:' + cs.textShadow + ';' +
        'line-height:' + cs.lineHeight + ';white-space:nowrap;' +
        'clip-path:inset(' + (s * sliceH) + 'px 0 ' + (baseH - (s + 1) * sliceH) + 'px 0);' +
        'transform:translateX(0);transition:transform 0.06s linear;' +
        'will-change:transform;opacity:0.95;pointer-events:none;user-select:none;';
      els.textStage.appendChild(slice);
      lineSlices.push(slice);
    }

    triggerColorBand();

    var phase = 0;
    var corruptTimer = every(function () {
      phase++;

      var intensity;
      if (phase <= 3) intensity = 0.12 + phase * 0.12;
      else if (phase <= 6) intensity = 0.55;
      else intensity = Math.max(0, 0.55 - (phase - 6) * 0.15);

      var corrupted = corruptText(originalText, intensity);
      els.textLayer.textContent = corrupted;
      lineSlices.forEach(function (sl) { sl.textContent = corrupted; });

      var maxShift = phase <= 6 ? 60 : 30;
      lineSlices.forEach(function (sl) {
        sl.style.transform = 'translateX(' + rnd(-maxShift / 2, maxShift / 2) + 'px)';
      });

      if (phase >= 4 && phase <= 6 && Math.random() < 0.35) flashReadableWord();
      if (phase % 2 === 0) triggerColorBand();

      if (phase > 8) {
        stop(corruptTimer);
        lineSlices.forEach(function (sl) { sl.remove(); });
        triggerColorBand();

        /* 第一步：报错定格（复用 textLayer，不再 innerHTML 覆盖，便于重播） */
        els.textLayer.classList.remove('typing');
        els.textLayer.classList.add('error');
        els.textLayer.style.visibility = '';
        els.textLayer.textContent = cfg.errorText;
        document.body.classList.add('shake-hard');
        disableCursor();

        later(function () {
          /* 阶段 A：血色渗出 + 撕裂频发 */
          els.bloodOverlay.style.opacity = '0.6';

          var tearTimer = every(spawnTear, 90);
          later(function () { stop(tearTimer); }, 1200);

          var tearCount = 0;
          var tearRamp = every(function () {
            tearCount++;
            spawnTear(); spawnTear();
            if (tearCount > 10) stop(tearRamp);
          }, 120);

          /* 阶段 B：报错文本剧烈崩坏 */
          var violent = every(function () {
            els.textLayer.textContent = corruptText(cfg.errorText, 0.85);
            els.textLayer.style.color = Math.random() < 0.5 ? '#ff2a2a' : '#fff';
            els.textLayer.style.textShadow = '0 0 12px #f00, 0 0 30px #f00, 0 0 60px #900';
            els.textLayer.style.transform =
              'translate(' + rnd(-8, 8) + 'px, ' + rnd(-5, 5) + 'px)';
          }, 45);

          /* 阶段 C：错误代码风暴 → 全屏红色闪动 */
          later(function () {
            stop(violent); stop(tearRamp);
            els.textLayer.style.visibility = 'hidden';
            els.bloodOverlay.style.opacity = '0.9';

            runErrorCodeBurst(cfg.burst.duration);

            later(function () {
              clearCodeBurst();
              els.redAlert.classList.add('on');
              var redTear = every(spawnTear, 70);

              /* 阶段 D：红闪结束 → 闪白 → 黑屏转场 */
              later(function () {
                stop(redTear);
                els.redAlert.classList.remove('on');
                document.body.classList.remove('shake-hard');

                els.flashWhite.classList.add('on');
                later(function () {
                  els.flashWhite.classList.remove('on');
                  els.bloodOverlay.style.opacity = '0';

                  els.blackout.classList.add('active');
                  later(function () {
                    els.blackout.classList.remove('active');
                    finish();
                  }, 260);
                }, 520);
              }, 1100);
            }, cfg.burst.duration);
          }, 1200);
        }, 700);
      }
    }, 130);
  }

  /* ===== 5.5 减弱动效降级序列：无频闪、无抖动、无风暴，只走静态状态切换 ===== */
  function runReducedSequence() {
    els.textLayer.classList.remove('typing');
    els.textLayer.classList.add('error');
    els.textLayer.textContent = cfg.errorText;
    els.bloodOverlay.style.opacity = '0.35';

    later(function () {
      els.blackout.classList.add('active');
      later(function () {
        els.blackout.classList.remove('active');
        els.bloodOverlay.style.opacity = '0';
        finish();
      }, 700);
    }, 1000);
  }

  function finish() {
    state.phase = 'done';
    if (typeof cfg.onDone === 'function') {
      try { cfg.onDone(); } catch (e) { /* 不吞掉页面其它逻辑 */ }
    }
    global.dispatchEvent(new CustomEvent('corruption:done'));
    if (cfg.replay) enterReplay();
  }

  function enterReplay() {
    els.btn.textContent = cfg.replayLabel;
    els.btn.style.pointerEvents = '';
    els.btn.classList.add('show');
  }

  /* ===== 6. 重置 ===== */
  function reset() {
    clearAll();
    clearCodeBurst();
    els.textStage.querySelectorAll('.hidden-word, .color-band').forEach(function (n) { n.remove(); });
    els.bloodOverlay.style.opacity = '0';
    els.redAlert.classList.remove('on');
    els.flashWhite.classList.remove('on');
    els.blackout.classList.remove('active');
    document.body.classList.remove('shake-hard');
    els.textLayer.style.cssText = '';
    enableCursor();
    startTyping();
  }

  /* ===== 7. 虚拟光标 & 粒子拖影 ===== */
  function updateCursor() {
    if (!state.cursorEnabled) { cursorRaf = null; return; }
    mouse.x += (mouse.sx - mouse.x) * 0.6;
    mouse.y += (mouse.sy - mouse.y) * 0.6;
    els.cursor.style.transform = 'translate(' + mouse.x + 'px, ' + mouse.y + 'px)';
    cursorRaf = requestAnimationFrame(updateCursor);
  }

  function spawnParticle(x, y) {
    var p = document.createElement('div');
    p.className = 'trail-particle';
    var size = 2 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = (x + rnd(-5, 5) - size / 2) + 'px';
    p.style.top = (y + rnd(-5, 5) - size / 2) + 'px';
    p.style.animationDuration = rnd(0.5, 1.0) + 's';
    els.trailContainer.appendChild(p);
    p.addEventListener('animationend', function () { p.remove(); });
  }

  function onPointerMove(e) {
    /* 忽略部分环境（headless / 自动化）在页面加载时派发的 (0,0) 伪指针事件，
       否则首屏虚拟光标会被钉在左上角；真实指针几乎不会精确停在 (0,0)。 */
    if (e.clientX === 0 && e.clientY === 0) return;
    mouse.sx = e.clientX;
    mouse.sy = e.clientY;
    if (!state.cursorEnabled || !cfg.enableParticles) return;
    var now = Date.now();
    if (now - mouse.lastTrail > 12) {
      mouse.lastTrail = now;
      for (var n = 0; n < 3; n++) spawnParticle(e.clientX, e.clientY);
    }
  }

  function enableCursor() {
    if (!cfg.enableCursor || !hasFinePointer() || isReduced()) {
      state.cursorEnabled = false;
      document.body.classList.remove('has-cursor');
      return;
    }
    document.body.classList.add('has-cursor');
    state.cursorEnabled = true;
    els.cursor.style.display = '';
    /* 首帧同步：没有任何 mousemove 时（如刚打开页面）光标落在视口中心，而不是 (0,0) */
    els.cursor.style.transform = 'translate(' + mouse.x + 'px, ' + mouse.y + 'px)';
    cursorRaf = requestAnimationFrame(updateCursor);
  }

  /* 报错定格后关掉光标与拖影，避免红屏阶段还拖着发光尾巴 */
  function disableCursor() {
    state.cursorEnabled = false;
    els.cursor.style.display = 'none';
    els.trailContainer.textContent = '';
  }

  /* ===== 8. 生命周期 ===== */
  function onClick() {
    if (state.phase === 'ready') {
      els.textLayer.style.animation = 'quickShake 0.08s 3';
      later(function () { els.textLayer.style.animation = ''; }, 250);
      later(runDataCorruption, 300);
    } else if (state.phase === 'done') {
      reset();
    }
  }

  function init(options) {
    cfg = Object.assign({}, DEFAULT_CONFIG, options || {});
    cfg.burst = Object.assign({}, DEFAULT_CONFIG.burst, (options && options.burst) || {});

    els.textStage = document.getElementById('textStage');
    els.textLayer = document.getElementById('textLayer');
    els.btn = document.getElementById('btn');
    els.blackout = document.getElementById('blackout');
    els.bloodOverlay = document.getElementById('bloodOverlay');
    els.redAlert = document.getElementById('redAlert');
    els.flashWhite = document.getElementById('flashWhite');
    els.codeBurst = document.getElementById('codeBurst');
    els.cursor = document.getElementById('virtualCursor');
    els.trailContainer = document.getElementById('trailContainer');
    els.rmNote = document.getElementById('rmNote');

    mediaReduce = matchMediaSafe('(prefers-reduced-motion: reduce)');
    mediaFine = matchMediaSafe('(hover: hover) and (pointer: fine)');

    if (isReduced() && cfg.showReducedMotionNote && els.rmNote) {
      els.rmNote.classList.add('show');
    }

    /* 用户在系统设置里改「减弱动态效果」时即时响应，无需刷新 */
    onMediaChange = function () {
      if (isReduced()) {
        if (cfg.showReducedMotionNote && els.rmNote) els.rmNote.classList.add('show');
        disableCursor();
      } else {
        if (state.phase !== 'corrupting' && state.phase !== 'done') enableCursor();
      }
    };
    if (mediaReduce.addEventListener) mediaReduce.addEventListener('change', onMediaChange);

    mouse.sx = mouse.x = global.innerWidth / 2;
    mouse.sy = mouse.y = global.innerHeight / 2;

    els.btn.addEventListener('click', onClick);
    global.addEventListener('mousemove', onPointerMove);

    enableCursor();
    startTyping();
    state.running = true;
    return publicApi;
  }

  function destroy() {
    clearAll();
    els.btn.removeEventListener('click', onClick);
    global.removeEventListener('mousemove', onPointerMove);
    if (mediaReduce && mediaReduce.removeEventListener && onMediaChange) {
      mediaReduce.removeEventListener('change', onMediaChange);
    }
    document.body.classList.remove('has-cursor', 'shake-hard');
    if (els.rmNote) els.rmNote.classList.remove('show');
    state.running = false;
    state.phase = 'boot';
  }

  var publicApi = {
    version: VERSION,
    init: init,
    destroy: destroy,
    reset: function () { if (state.running) reset(); },
    /* 运行时改配置：PhosphorDecay.configure({ text: '...' }) */
    configure: function (patch) {
      if (!cfg) return init(patch);
      Object.assign(cfg, patch || {});
      if (patch && patch.burst) cfg.burst = Object.assign({}, cfg.burst, patch.burst);
      return publicApi;
    },
    get config() { return cfg; }
  };

  global.PhosphorDecay = publicApi;

  /* 自动启动；若你自己调 init，请在 <script> 前设 window.__PHOSPHOR_NO_AUTOINIT = true */
  if (!global.__PHOSPHOR_NO_AUTOINIT) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { init(); });
    } else {
      init();
    }
  }
})(window);
</script>
</body>
</html>
